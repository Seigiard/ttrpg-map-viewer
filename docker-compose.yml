services:
  catalog:
    build:
      context: .
      target: production
    ports:
      - "8080:80"
    volumes:
      # The collection is mounted read-only; nothing is ever written into it.
      - ${COLLECTION:-./files}:/maps:ro
      - catalog-data:/data
    environment:
      - FILES=/maps
      - DATA=/data
      # - THUMBNAIL_CONCURRENCY=2
      # - ANTHROPIC_API_KEY=        # Enables cover classification when set.
      # - CLASSIFY_MODEL=claude-haiku-5-5
      # - CLASSIFY_CONCURRENCY=2    # Range: 1-8.
      # - CLASSIFY_MAX_CALLS=50     # Optional process-wide cap.
    restart: unless-stopped

volumes:
  catalog-data:
